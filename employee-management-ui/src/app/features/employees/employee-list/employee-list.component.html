<div class="container">

  <div class="header">

    <h2>Employees</h2>

    <button
      class="add-member-btn"
      routerLink="/employees/add">
      + Add Employee
    </button>

  </div>

  <table>

    <thead>
      <tr>
        <th>Id</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Gender</th>
        <th>Salary</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let employee of employees">

        <td>{{ employee.employeeId }}</td>
        <td>{{ employee.firstName }}</td>
        <td>{{ employee.lastName }}</td>
        <td>{{ employee.email }}</td>
        <td>{{ employee.phoneNumber }}</td>
        <td>{{ employee.gender }}</td>
        <td>{{ employee.salary }}</td>

        <td>
          {{ employee.isActive ? 'Active' : 'Inactive' }}
        </td>

        <td>
          <button
            class="edit-btn"
            [routerLink]="['/employees/edit', employee.employeeId]">
            Edit
          </button>

          <button
            class="delete-btn"
            (click)="deleteEmployee(employee.employeeId!)">
            Delete
          </button>
        </td>

      </tr>

    </tbody>

  </table>

</div>
