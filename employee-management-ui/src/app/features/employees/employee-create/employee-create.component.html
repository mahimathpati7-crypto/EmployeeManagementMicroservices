<div class="container">

  <h2>Add Employee</h2>

  <form (ngSubmit)="saveEmployee()">
    <div class="form-row">    
    <div class="form-group">
      <label>First Name</label>
      <input
        type="text"
        name="firstName"
        [(ngModel)]="employee.firstName"
        required>
    </div>
    <div class="form-group">
      <label>Last Name</label>
      <input
        type="text"
        name="lastName"
        [(ngModel)]="employee.lastName"
        required>
    </div>
    </div>

    <div class="form-row">    
    <!-- <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="employee.email"
        required>
    </div> -->
    <div class="form-group">
  <label>Email</label>

  <input
    type="email"
    name="email"
    [(ngModel)]="employee.email"
    #email="ngModel"
    required
    email
    placeholder="Enter Email">

  <!-- Required Validation -->
  <small class="error"
    *ngIf="email.errors?.['required'] &&
    (email.touched || email.dirty)">

    Email is required.

  </small>

  <!-- Email Format Validation -->
  <small class="error"
    *ngIf="email.errors?.['email'] &&
    (email.touched || email.dirty)">

    Please enter a valid email address.

  </small>

</div>
    <!-- <div class="form-group">
      <label>Phone Number</label>
      <input
        type="text"
        name="phoneNumber"
        [(ngModel)]="employee.phoneNumber">
    </div> -->
    <div class="form-group">
  <label>Phone Number</label>

  <input
    type="text"
    name="phoneNumber"
    [(ngModel)]="employee.phoneNumber"
    #phoneNumber="ngModel"
    required
    pattern="^[0-9]{10}$"
    maxlength="10"
    placeholder="Enter Phone Number">

  <small class="error"
    *ngIf="phoneNumber.errors?.['required'] &&
    (phoneNumber.touched || phoneNumber.dirty)">

    Phone Number is required.

  </small>

  <small class="error"
    *ngIf="phoneNumber.errors?.['pattern'] &&
    (phoneNumber.touched || phoneNumber.dirty)">

    Phone Number must be exactly 10 digits.

  </small>

</div>
    </div>

    <div class="form-row">    
    <div class="form-group">
      <label>Gender</label>

      <select
        name="gender"
        [(ngModel)]="employee.gender">

        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>

      </select>
    </div> 
    <div class="form-group">
      <label>Date Of Birth</label>
      <input
        type="date"
        name="dateOfBirth"
        [(ngModel)]="employee.dateOfBirth">
    </div>
    </div>

    <div class="form-row">    
    <div class="form-group">
      <label>Joining Date</label>
      <input
        type="date"
        name="joiningDate"
        [(ngModel)]="employee.joiningDate">
    </div>
    <div class="form-group">
      <label>Salary</label>
      <input
        type="number"
        name="salary"
        [(ngModel)]="employee.salary">
    </div>
    </div>

    <div class="form-row">    
    <div class="form-group">
      <label>Department</label>
      <select
  name="departmentId"
  [(ngModel)]="employee.departmentId">

  
      <option [ngValue]="0">
    Select Department
  </option>
  <option
    *ngFor="let department of departments"
    [value]="department.departmentId">

    {{ department.departmentName }}

  </option>

</select>
    </div>

       
    <div class="form-group">
      <label>Member</label>
      <select
  name="memberId"
  [(ngModel)]="employee.memberId">

  <option [ngValue]="0">
    Select Member
  </option>

  <option
    *ngFor="let member of members"
    [value]="member.memberId">

    {{ member.firstName }} {{ member.lastName }}

  </option>

</select>
    </div>
    </div>

    <br>

    <div class="button-container">
  <button type="submit">
    Save Employee
  </button>
</div>

  </form>

</div>
