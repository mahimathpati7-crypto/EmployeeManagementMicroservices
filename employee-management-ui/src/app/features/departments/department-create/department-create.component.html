<div class="container">

  <h2>Add Department</h2>

  <form (ngSubmit)="saveDepartment()">

    <div class="form-row">

      <div class="form-group">
        <label>Department Name</label>
        <input
          type="text"
          name="departmentName"
          [(ngModel)]="department.departmentName"
          required>
      </div>

      <div class="form-group">
        <label>Department Code</label>
        <input
          type="text"
          name="departmentCode"
          [(ngModel)]="department.departmentCode"
          required>
      </div>

    </div>

    <div class="form-row">

      <div class="form-group">
        <label>Description</label>
        <input
          type="text"
          name="description"
          [(ngModel)]="department.description">
      </div>

      <div class="form-group">
        <label>Location</label>
        <input
          type="text"
          name="location"
          [(ngModel)]="department.location">
      </div>

    </div>

    <div class="form-row">
      <div class="form-group">

  <label>Manager</label>

  <select
    name="managerId"
    [(ngModel)]="department.managerId"
    required>

    <option [ngValue]="0">
      Select Manager
    </option>

    <option
      *ngFor="let employee of employees"
      [ngValue]="employee.employeeId">

      {{ employee.firstName }} {{ employee.lastName }}

    </option>

  </select>

</div>

      <div class="form-group">
        <label>Status</label>

        <select
          name="isActive"
          [(ngModel)]="department.isActive">

          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>

        </select>
      </div>

    </div>

    <div class="button-container">

      <button type="submit">
        Save Department
      </button>

    </div>

  </form>

</div>
