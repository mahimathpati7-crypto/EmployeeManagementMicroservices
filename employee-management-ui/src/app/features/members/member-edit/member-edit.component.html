<div class="container">
<h2>Edit Member</h2>

<form (ngSubmit)="updateMember()">  

    <div class="form-row">

      <div class="form-group">
        <label>First Name</label>
        <input
          type="text"
          name="firstName"
          [(ngModel)]="member.firstName"
          required>
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input
          type="text"
          name="lastName"
          [(ngModel)]="member.lastName"
          required>
      </div>

    </div>

    <div class="form-row">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="member.email"
          required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input
          type="text"
          name="phoneNumber"
          [(ngModel)]="member.phoneNumber">
      </div>

    </div>

    <div class="form-row">

      <div class="form-group">
        <label>Address</label>
        <input
          type="text"
          name="address"
          [(ngModel)]="member.address">
      </div>

      <div class="form-group">
        <label>City</label>
        <input
          type="text"
          name="city"
          [(ngModel)]="member.city">
      </div>

    </div>

    <div class="form-row">

      <div class="form-group">
        <label>State</label>
        <input
          type="text"
          name="state"
          [(ngModel)]="member.state">
      </div>

      <div class="form-group">
        <label>Country</label>
        <input
          type="text"
          name="country"
          [(ngModel)]="member.country">
      </div>

    </div>

    <div class="form-row">

      <div class="form-group">
        <label>Membership Type</label>

        <select
          name="membershipType"
          [(ngModel)]="member.membershipType">

          <option value="">Select Membership Type</option>
          <option value="Basic">Basic</option>
          <option value="Premium">Premium</option>
          <option value="Standard">Standard</option>

        </select>
      </div>

      <div class="form-group">
        <label>Status</label>

        <select
          name="isActive"
          [(ngModel)]="member.isActive">

          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>

        </select>
      </div>

    </div>

    <div class="form-row">

      <div class="form-group">
        <label>Membership Start Date</label>

        <input
          type="date"
          name="membershipStartDate"
          [(ngModel)]="member.membershipStartDate">
      </div>

      <div class="form-group">
        <label>Membership End Date</label>

        <input
          type="date"
          name="membershipEndDate"
          [(ngModel)]="member.membershipEndDate">
      </div>

    </div>

    <div class="button-container">
      <button type="submit">
        Update Member
      </button>
    </div>

  </form>

</div>
